name: AKS Containerized Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-containerized-application
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform

  TF_STATE_RESOURCE_GROUP: rg-akscrud-tfstate
  TF_STATE_STORAGE_ACCOUNT: tfstateakscrudjwwmdy
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: aks-containerized-application.tfstate

  IMAGE_NAME: crud-api
  K8S_NAMESPACE: crud-api

jobs:

  infrastructure:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    env:
      TF_VAR_location: "Central India"
      TF_VAR_name_prefix: "akscrud"
      TF_VAR_environment: "dev"

      TF_VAR_vnet_address_space: '["10.20.0.0/16"]'
      TF_VAR_aks_subnet_address_prefix: "10.20.1.0/24"
      TF_VAR_application_gateway_subnet_address_prefix: "10.20.2.0/24"
      TF_VAR_private_endpoint_subnet_address_prefix: "10.20.3.0/24"
      TF_VAR_aks_service_private_ip: "10.20.1.50"

      TF_VAR_aks_system_node_count: "2"
      TF_VAR_aks_user_node_count: "2"
      TF_VAR_aks_vm_size: "Standard_B2s"
      TF_VAR_aks_admin_username: "azureadmin"

      TF_VAR_sql_admin_username: "sqladmin"
      TF_VAR_sql_database_name: "CrudApiDb"
      TF_VAR_sql_sku_name: "Basic"

      TF_VAR_tags: '{"Owner":"DevOps"}'

    outputs:
      acr_name: ${{ steps.tfoutputs.outputs.acr_name }}
      acr_login_server: ${{ steps.tfoutputs.outputs.acr_login_server }}
      aks_name: ${{ steps.tfoutputs.outputs.aks_name }}
      aks_resource_group: ${{ steps.tfoutputs.outputs.aks_resource_group }}
      sql_server_fqdn: ${{ steps.tfoutputs.outputs.sql_server_fqdn }}
      sql_database_name: ${{ steps.tfoutputs.outputs.sql_database_name }}
      aks_service_private_ip: ${{ steps.tfoutputs.outputs.aks_service_private_ip }}
      app_gateway_public_ip: ${{ steps.tfoutputs.outputs.app_gateway_public_ip }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_aks_ssh_public_key: ${{ secrets.AKS_SSH_PUBLIC_KEY }}
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=akscrud.tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_aks_ssh_public_key: ${{ secrets.AKS_SSH_PUBLIC_KEY }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            akscrud.tfplan

      - name: Read Terraform Outputs
        id: tfoutputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"
          echo "aks_resource_group=$(terraform output -raw aks_resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)" >> "$GITHUB_OUTPUT"
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> "$GITHUB_OUTPUT"
          echo "aks_service_private_ip=$(terraform output -raw aks_service_private_ip)" >> "$GITHUB_OUTPUT"
          echo "app_gateway_public_ip=$(terraform output -raw application_gateway_public_ip)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Docker Image
    needs: infrastructure
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login \
            --name "${{ needs.infrastructure.outputs.acr_name }}"

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -f ./docker/Dockerfile .

      - name: Push Docker Image
        run: |
          docker push \
            "${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Export Image Reference
        id: image
        run: |
          echo "image=${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to AKS
    needs:
      - infrastructure
      - build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ needs.infrastructure.outputs.aks_resource_group }}" \
            --name "${{ needs.infrastructure.outputs.aks_name }}" \
            --overwrite-existing

      - name: Create Rendered Kubernetes Directory
        run: |
          mkdir -p kubernetes/rendered

      - name: Render Namespace
        run: |
          cp kubernetes/namespace.yaml \
             kubernetes/rendered/namespace.yaml

      - name: Render ConfigMap
        run: |
          cp kubernetes/configmap.yaml \
             kubernetes/rendered/configmap.yaml

      - name: Render Deployment
        run: |
          sed \
            -e "s|__ACR_LOGIN_SERVER__|${{ needs.infrastructure.outputs.acr_login_server }}|g" \
            -e "s|__IMAGE_TAG__|${{ github.sha }}|g" \
            kubernetes/deployment.yaml \
            > kubernetes/rendered/deployment.yaml

      - name: Render Service
        run: |
          sed \
            -e "s|__AKS_SERVICE_PRIVATE_IP__|${{ needs.infrastructure.outputs.aks_service_private_ip }}|g" \
            kubernetes/service.yaml \
            > kubernetes/rendered/service.yaml

      - name: Render SQL Secret
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_SERVER_FQDN: ${{ needs.infrastructure.outputs.sql_server_fqdn }}
          SQL_DATABASE_NAME: ${{ needs.infrastructure.outputs.sql_database_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path("kubernetes/secret.yaml").read_text()

          connection_string = (
              f"Server=tcp:{os.environ['SQL_SERVER_FQDN']},1433;"
              f"Initial Catalog={os.environ['SQL_DATABASE_NAME']};"
              f"User ID=sqladmin;"
              f"Password={os.environ['SQL_ADMIN_PASSWORD']};"
              f"Encrypt=True;"
              f"TrustServerCertificate=False;"
              f"Connection Timeout=30;"
          )

          rendered = template.replace(
              "__CONNECTION_STRING__",
              connection_string
          )

          Path("kubernetes/rendered/secret.yaml").write_text(rendered)
          PY

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply \
            -f kubernetes/rendered/namespace.yaml

          kubectl apply \
            -f kubernetes/rendered/configmap.yaml

          kubectl apply \
            -f kubernetes/rendered/secret.yaml

          kubectl apply \
            -f kubernetes/rendered/deployment.yaml

          kubectl apply \
            -f kubernetes/rendered/service.yaml

      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/crud-api \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=10m

      - name: Verify Pods
        run: |
          kubectl get pods \
            --namespace "${K8S_NAMESPACE}" \
            -o wide

      - name: Verify Service
        run: |
          kubectl get service crud-api-service \
            --namespace "${K8S_NAMESPACE}" \
            -o wide

      - name: Verify Replica Count
        run: |
          READY=$(kubectl get deployment crud-api \
            --namespace "${K8S_NAMESPACE}" \
            -o jsonpath='{.status.readyReplicas}')

          echo "Ready replicas: ${READY}"

          if [ "${READY}" != "3" ]; then
            echo "Expected 3 ready replicas."
            exit 1
          fi

      - name: Verify Application Gateway
        env:
          APP_GATEWAY_PUBLIC_IP: ${{ needs.infrastructure.outputs.app_gateway_public_ip }}
        run: |
          echo "Application Gateway Public IP: ${APP_GATEWAY_PUBLIC_IP}"

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://${APP_GATEWAY_PUBLIC_IP}/api/Products"; then

              echo ""
              echo "Application Gateway is serving the API."
              exit 0
            fi

            echo "Application Gateway is not ready yet. Attempt ${i}/30."
            sleep 10
          done

          echo "Application Gateway smoke test failed."
          exit 1

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "AKS DEPLOYMENT COMPLETED"
          echo "========================================="
          echo "Image:"
          echo "${{ needs.build.outputs.image }}"
          echo ""
          echo "AKS:"
          echo "${{ needs.infrastructure.outputs.aks_name }}"
          echo ""
          echo "Service IP:"
          echo "${{ needs.infrastructure.outputs.aks_service_private_ip }}"
          echo ""
          echo "Application Gateway:"
          echo "${{ needs.infrastructure.outputs.app_gateway_public_ip }}"
