name: AKS Containerized Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-containerized-application
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  TF_STATE_RESOURCE_GROUP: rg-akscrud-tfstate-new
  TF_STATE_STORAGE_ACCOUNT: tfstateakshelm8l19hm
  TF_STATE_CONTAINER: tfstate
  TF_STATE_KEY: aks-containerized-application.tfstate
  IMAGE_NAME: crud-api
  K8S_NAMESPACE: crud-api
  HELM_RELEASE_NAME: crud-api
  HELM_CHART_PATH: ./helm/crud-api

jobs:
  infrastructure:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.tfoutputs.outputs.acr_name }}
      acr_login_server: ${{ steps.tfoutputs.outputs.acr_login_server }}
      aks_name: ${{ steps.tfoutputs.outputs.aks_name }}
      aks_resource_group: ${{ steps.tfoutputs.outputs.aks_resource_group }}
      sql_server_fqdn: ${{ steps.tfoutputs.outputs.sql_server_fqdn }}
      sql_database_name: ${{ steps.tfoutputs.outputs.sql_database_name }}
      aks_service_private_ip: ${{ steps.tfoutputs.outputs.aks_service_private_ip }}
      app_gateway_public_ip: ${{ steps.tfoutputs.outputs.app_gateway_public_ip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_aks_ssh_public_key: ${{ secrets.AKS_SSH_PUBLIC_KEY }}
        run: terraform plan -out=akscrud.tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_aks_ssh_public_key: ${{ secrets.AKS_SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve akscrud.tfplan

      - name: Read Terraform Outputs
        id: tfoutputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"
          echo "aks_resource_group=$(terraform output -raw aks_resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)" >> "$GITHUB_OUTPUT"
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> "$GITHUB_OUTPUT"
          echo "aks_service_private_ip=$(terraform output -raw aks_service_private_ip)" >> "$GITHUB_OUTPUT"
          echo "app_gateway_public_ip=$(terraform output -raw application_gateway_public_ip)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Docker Image
    needs: infrastructure
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ needs.infrastructure.outputs.acr_name }}"

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -f ./docker/Dockerfile .

      - name: Push Docker Image
        run: docker push "${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Export Image Reference
        id: image
        run: echo "image=${{ needs.infrastructure.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to AKS with Helm
    needs:
      - infrastructure
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Validate Helm Chart
        run: helm lint "${HELM_CHART_PATH}"

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ needs.infrastructure.outputs.aks_resource_group }}" \
            --name "${{ needs.infrastructure.outputs.aks_name }}" \
            --overwrite-existing

      - name: Create Kubernetes Namespace
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create SQL Connection Secret
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_SERVER_FQDN: ${{ needs.infrastructure.outputs.sql_server_fqdn }}
          SQL_DATABASE_NAME: ${{ needs.infrastructure.outputs.sql_database_name }}
        run: |
          CONNECTION_STRING="Server=tcp:${SQL_SERVER_FQDN},1433;Initial Catalog=${SQL_DATABASE_NAME};User ID=sqladmin;Password=${SQL_ADMIN_PASSWORD};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          kubectl create secret generic crud-api-secret \
            --namespace "${K8S_NAMESPACE}" \
            --from-literal="ConnectionStrings__DefaultConnection=${CONNECTION_STRING}" \
            --dry-run=client -o yaml | kubectl apply -f -

          unset CONNECTION_STRING

      - name: Render Helm Templates
        run: |
          helm template "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --set-string "image.repository=${{ needs.infrastructure.outputs.acr_login_server }}/${IMAGE_NAME}" \
            --set-string "image.tag=${{ github.sha }}" \
            > /tmp/crud-api-rendered.yaml

      - name: Deploy Helm Release
        run: |
          helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set-string "image.repository=${{ needs.infrastructure.outputs.acr_login_server }}/${IMAGE_NAME}" \
            --set-string "image.tag=${{ github.sha }}" \
            --wait \
            --timeout 10m \
            --atomic

      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/crud-api \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=10m

      - name: Verify Replica Count
        run: |
          DESIRED=$(kubectl get deployment crud-api --namespace "${K8S_NAMESPACE}" -o jsonpath='{.spec.replicas}')
          READY=$(kubectl get deployment crud-api --namespace "${K8S_NAMESPACE}" -o jsonpath='{.status.readyReplicas}')

          echo "Desired replicas: ${DESIRED}"
          echo "Ready replicas: ${READY}"

          if [ -z "${READY}" ] || [ "${READY}" != "${DESIRED}" ]; then
            echo "Replica verification failed."
            exit 1
          fi

      - name: Wait for Internal LoadBalancer
        env:
          EXPECTED_SERVICE_IP: ${{ needs.infrastructure.outputs.aks_service_private_ip }}
        run: |
          for i in {1..30}; do
            SERVICE_IP=$(kubectl get service crud-api-service \
              --namespace "${K8S_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            echo "Service IP: ${SERVICE_IP}"

            if [ "${SERVICE_IP}" = "${EXPECTED_SERVICE_IP}" ]; then
              echo "Internal LoadBalancer is ready."
              exit 0
            fi

            echo "Waiting for internal LoadBalancer. Attempt ${i}/30."
            sleep 10
          done

          echo "Internal LoadBalancer did not receive the expected IP."
          exit 1

      - name: Verify Pods
        run: kubectl get pods --namespace "${K8S_NAMESPACE}" -o wide

      - name: Verify Service
        run: kubectl get service crud-api-service --namespace "${K8S_NAMESPACE}" -o wide

      - name: Verify Helm Release
        run: helm status "${HELM_RELEASE_NAME}" --namespace "${K8S_NAMESPACE}"

      - name: Verify Application Gateway
        env:
          APP_GATEWAY_PUBLIC_IP: ${{ needs.infrastructure.outputs.app_gateway_public_ip }}
        run: |
          echo "Application Gateway Public IP: ${APP_GATEWAY_PUBLIC_IP}"

          for i in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "http://${APP_GATEWAY_PUBLIC_IP}/api/Products"; then
              echo ""
              echo "Application Gateway is serving the API."
              exit 0
            fi

            echo "Application Gateway is not ready yet. Attempt ${i}/30."
            sleep 10
          done

          echo "Application Gateway smoke test failed."
          exit 1

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "AKS DEPLOYMENT COMPLETED"
          echo "========================================="
          echo "Image:"
          echo "${{ needs.build.outputs.image }}"
          echo ""
          echo "AKS:"
          echo "${{ needs.infrastructure.outputs.aks_name }}"
          echo ""
          echo "Service IP:"
          echo "${{ needs.infrastructure.outputs.aks_service_private_ip }}"
          echo ""
          echo "Application Gateway:"
          echo "${{ needs.infrastructure.outputs.app_gateway_public_ip }}"
          echo ""
          echo "Helm Release:"
          echo "${HELM_RELEASE_NAME}"
